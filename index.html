<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>What Should I</title>
<meta name="description" content="What Should I - one app for the daily questions: what to wear, what to eat, what to watch.">
<meta name="theme-color" content="#e6e9f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="What Should I">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar">
  <div class="brand">What Should I</div>
  <div class="brsub">wear &middot; eat &middot; watch</div>
  <div class="seg" role="tablist" aria-label="Choose a tab">
    <button class="segbtn active" role="tab" aria-selected="true" data-tab="wear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3a3 3 0 0 0 6 0l4.6 2.6a1 1 0 0 1 .5 1.1l-1.3 3.1a1 1 0 0 1-1.3.6L16 9.7V20a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9.7l-1.5.7a1 1 0 0 1-1.3-.6L3.9 6.7a1 1 0 0 1 .5-1.1L9 3z"/></svg>
      <span>Wear</span>
    </button>
    <button class="segbtn" role="tab" aria-selected="false" data-tab="eat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M8 3v18"/><path d="M17 3c-1.7 1.5-2.5 3.8-2.5 6.5 0 2 .8 3.5 2.5 3.5V21"/></svg>
      <span>Eat</span>
    </button>
    <button class="segbtn" role="tab" aria-selected="false" data-tab="watch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>
      <span>Watch</span>
    </button>
  </div>
</header>
<main id="stage">
  <section class="pane active" id="pane-wear" data-url="https://aajkyapehnu.vercel.app" data-name="Wear"></section>
  <section class="pane" id="pane-eat" data-url="https://aajkyakhau.vercel.app" data-name="Eat"></section>
  <section class="pane" id="pane-watch" data-url="https://aaj-kya-dekhu.vercel.app" data-name="Watch"></section>
</main>
<script src="app.js"></script>
</body>
</html>

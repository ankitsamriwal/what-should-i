<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>What Should I</title>
<meta name="description" content="What Should I - one app for the daily questions: what to wear, eat, watch, drink, gift, where to travel and where to go tonight.">
<meta name="theme-color" content="#e6e9f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="What Should I">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar">
  <div id="bar-home">
    <div class="brand">What Should I</div>
    <div class="brsub">one app for the daily questions</div>
  </div>
  <div id="bar-cat" hidden>
    <button id="homebtn" type="button" aria-label="Back to all categories">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span>All</span>
    </button>
    <div id="bar-title"></div>
  </div>
</header>
<main id="stage">
  <section class="pane active" id="pane-home"></section>
  <section class="pane" id="pane-wear" data-url="https://aajkyapehnu.vercel.app" data-name="Wear"></section>
  <section class="pane" id="pane-eat" data-url="https://aajkyakhau.vercel.app" data-name="Eat"></section>
  <section class="pane" id="pane-watch" data-url="https://aaj-kya-dekhu.vercel.app" data-name="Watch"></section>
  <section class="pane" id="pane-drink"></section>
  <section class="pane" id="pane-travel"></section>
  <section class="pane" id="pane-gift"></section>
  <section class="pane" id="pane-go"></section>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>

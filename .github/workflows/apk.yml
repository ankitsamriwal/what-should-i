name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
env:
  KS_PASS: whatshouldi-699b27b3
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'apk:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - name: Stage web root into www
        run: bash scripts/prepare_www.sh
      - name: Capacitor sync
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Patch SDK versions + icon gotcha
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/; s/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' android/variables.gradle
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.png
      - name: Inject release signing
        run: python3 scripts/inject_signing.py
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Stage APK into site /get
        run: |
          mkdir -p get
          cp android/app/build/outputs/apk/release/app-release.apk get/what-should-i.apk
          ls -la get/
      - uses: actions/upload-artifact@v4
        with:
          name: what-should-i-apk
          path: get/what-should-i.apk
      - name: Publish APK as GitHub release asset
        run: |
          gh release delete apk-latest --yes >/dev/null 2>&1 || true
          gh release create apk-latest get/what-should-i.apk --title "What Should I - latest APK" --notes "Auto-built from ${GITHUB_SHA::7}" --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
